# Pubblica l'estensione sul Chrome Web Store a ogni tag di versione.
#
# Esiste perché la pubblicazione manuale è stata dimenticata per quattro
# versioni: lo store è rimasto alla 1.7.0 mentre il repo era alla 1.12.0. Un
# compito che si ricorda è un compito che prima o poi si scorda.
name: publish-extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da pubblicare (es. v1.12.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    # Sui fork i secret non esistono: senza questa guardia il job fallirebbe a
    # ogni tag altrui, con un errore che non dice nulla a nessuno.
    if: github.repository == 'frsorrentino/chrome-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Servono i tag per confrontare extension/ con la release precedente.
          fetch-depth: 0

      # Una release può non toccare l'estensione (1.23.2: solo server): allora
      # il manifest resta alla versione che è già sullo store e nessun passo
      # sotto parla con lo store — niente upload, niente revisione per un
      # pacchetto identico. Se il manifest diverge dal tag MA extension/ è
      # cambiata, è un bump dimenticato: errore, come prima.
      - name: L'estensione fa parte di questa release?
        id: scope
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          MANIFEST_VERSION="$(node -p "require('./extension/manifest.json').version")"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          if [ "$TAG_VERSION" = "$MANIFEST_VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$MANIFEST_VERSION" >/dev/null \
               && git diff --quiet "v$MANIFEST_VERSION" HEAD -- extension/; then
            echo "::notice::extension/ identica a v$MANIFEST_VERSION: questa release non tocca lo store"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::il tag dice $TAG_VERSION, il manifest $MANIFEST_VERSION, e extension/ è cambiata da v$MANIFEST_VERSION: manca il bump del manifest"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.publish == 'true'
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
        if: steps.scope.outputs.publish == 'true'

      # Cancello di qualità: un pacchetto che non passa i test non arriva agli
      # utenti dello store, dove un rollback costa un'altra revisione.
      - name: Test
        if: steps.scope.outputs.publish == 'true'
        run: npm test

      - name: Costruisci lo zip
        if: steps.scope.outputs.publish == 'true'
        id: package
        run: |
          bash scripts/package-extension.sh
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          echo "zip=dist/chrome-bridge-extension-$VERSION.zip" >> "$GITHUB_OUTPUT"

      # cws-upload legge le credenziali da CWS_* quando il file locale non c'è.
      # In caso di fallimento stampa il motivo testuale di Google: il più comune
      # è "You may not edit or publish an item that is in review", cioè una
      # versione precedente è ancora in revisione e va aspettata.
      - name: Carica e pubblica sullo store
        if: steps.scope.outputs.publish == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: |
          set +e
          node tools/cws-upload.mjs "${{ steps.package.outputs.zip }}" --publish
          CODE=$?
          set -e
          # 2 = lo store ha rifiutato per un'attesa (una versione precedente è in
          # revisione): non è un guasto, e retry-store-publish ci riprova ogni sei
          # ore finché passa. Farlo diventare rosso qui insegnerebbe a ignorare i
          # rossi.
          case "$CODE" in
            0) echo "::notice::pubblicata" ;;
            2) echo "::notice::store occupato da una versione in revisione; ci pensa retry-store-publish" ;;
            *) echo "::error::pubblicazione fallita per un motivo che richiede intervento"; exit 1 ;;
          esac

      - name: Stato dell'item dopo il caricamento
        if: always() && steps.scope.outputs.publish == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: node tools/cws-upload.mjs --status
