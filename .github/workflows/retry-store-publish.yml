# Ritenta la pubblicazione finché lo store non accetta l'ultima versione taggata.
#
# Serve perché il caricamento fallisce quando una versione precedente è ancora in
# revisione, e una revisione può durare giorni: senza questo, la pubblicazione
# tornerebbe a dipendere da qualcuno che se ne ricorda — che è il problema che
# publish-extension.yml era nato per togliere.
name: retry-store-publish

on:
  schedule:
    # Ogni sei ore. Una revisione dura ore o giorni: più fitto sarebbe rumore,
    # più rado allungherebbe l'attesa senza motivo.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    if: github.repository == 'frsorrentino/chrome-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Ultimo tag di versione
        id: tag
        run: |
          TAG="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "$TAG" ]; then echo "::error::nessun tag v* nel repo"; exit 1; fi
          # La versione da portare sullo store è quella del manifest nel tag,
          # non il numero del tag: una release di solo server (1.23.2) lascia
          # il manifest alla versione già caricata, e non va ricaricata.
          VERSION="$(git show "$TAG:extension/manifest.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ultimo tag: $TAG, estensione $VERSION"

      - name: Lo store è già a questa versione?
        id: check
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: |
          set -o pipefail
          STATUS="$(node tools/cws-upload.mjs --status)" || { echo "$STATUS"; echo "::error::credenziali non valide"; exit 1; }
          echo "$STATUS"
          CRX="$(echo "$STATUS" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).crxVersion || ''")"
          if [ "$CRX" = "${{ steps.tag.outputs.version }}" ]; then
            # crxVersion è la BOZZA, non la vetrina: la versione può essere
            # caricata e mai pubblicata (29/09: 1.26.0 in bozza, publish
            # rifiutato per la privacy da compilare). Si chiede la pubblicazione:
            # 0 inviata, 2 già in revisione o già pubblicata, 1 serve una persona.
            echo "done=true" >> "$GITHUB_OUTPUT"
            set +e
            node tools/cws-upload.mjs --publish-only
            CODE=$?
            set -e
            case "$CODE" in
              0) echo "::notice::${{ steps.tag.outputs.version }} era in bozza: inviata in revisione" ;;
              2) echo "::notice::${{ steps.tag.outputs.version }} già in revisione o pubblicata: niente da fare" ;;
              *) echo "::error::${{ steps.tag.outputs.version }} è in bozza ma lo store rifiuta la pubblicazione: serve intervento (motivo sopra)"; exit 1 ;;
            esac
          else
            echo "store a '$CRX', tag a '${{ steps.tag.outputs.version }}': si tenta"
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      # Il pacchetto deve venire dal tag, ma gli strumenti no: il tag è per
      # definizione più vecchio di qualunque correzione allo strumento, e alla
      # prima prova ha fatto girare una cws-upload priva del classificatore
      # attesa/errore, trasformando un'attesa normale in un job rosso.
      - name: Metti da parte gli strumenti correnti
        if: steps.check.outputs.done == 'false'
        run: cp -r tools "$RUNNER_TEMP/tools-main"

      - name: Checkout del tag
        if: steps.check.outputs.done == 'false'
        run: git checkout --detach "${{ steps.tag.outputs.tag }}"

      - name: Test
        if: steps.check.outputs.done == 'false'
        run: npm test

      - name: Costruisci lo zip
        if: steps.check.outputs.done == 'false'
        id: package
        run: |
          bash scripts/package-extension.sh
          echo "zip=dist/chrome-bridge-extension-${{ steps.tag.outputs.version }}.zip" >> "$GITHUB_OUTPUT"

      # cws-upload esce 2 quando il rifiuto è un'attesa (versione precedente in
      # revisione, o già pubblicata) e 1 quando serve una persona. Solo il
      # secondo caso deve far diventare rosso il job: un'attesa notificata ogni
      # sei ore diventa rumore, e il rumore nasconde gli errori veri.
      - name: Carica e pubblica
        if: steps.check.outputs.done == 'false'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: |
          set +e
          node "$RUNNER_TEMP/tools-main/cws-upload.mjs" "${{ steps.package.outputs.zip }}" --publish
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "::notice::${{ steps.tag.outputs.version }} caricata e pubblicata" ;;
            2) echo "::notice::ancora bloccata, si ritenta al prossimo giro" ;;
            *) echo "::error::pubblicazione fallita per un motivo che richiede intervento"; exit 1 ;;
          esac
