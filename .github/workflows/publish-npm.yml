# Pubblica il pacchetto su npm a ogni tag di versione.
#
# È l'ultimo canale rimasto manuale: store e registry si allineano da soli.
#
# Nessun token: npm è configurato con il trusted publishing, cioè riconosce
# questo repo e questo file come publisher fidato e accetta la credenziale OIDC
# che GitHub emette per la singola esecuzione. Il nome del file è parte del patto
# — rinominarlo fa fallire l'autenticazione finché non lo si aggiorna anche sulla
# pagina del pacchetto su npmjs.com.
name: publish-npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da pubblicare (es. v1.13.0)'
        required: true

permissions:
  contents: read
  id-token: write   # la credenziale OIDC che npm verifica al posto del token

jobs:
  publish:
    if: github.repository == 'frsorrentino/chrome-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Il trusted publishing esiste da npm 11.5.1: Node 20 ne porta una 10.x,
      # che ignora l'OIDC e fallirebbe chiedendo un token. La versione viene
      # stampata perché il giorno che questo si rompe, è la prima cosa da vedere.
      - name: npm abbastanza recente per l'OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # Una versione pubblicata su npm non si può sovrascrivere né correggere:
      # i test girano prima, non dopo.
      - name: Test
        run: npm test

      - name: package.json corrisponde al tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG"
          if [ "$TAG_VERSION" != "$PKG" ]; then
            echo "::error::package.json dice $PKG, il tag $TAG_VERSION"
            exit 1
          fi

      # Ripubblicare una versione già su npm non è un guasto: capita rilanciando
      # il workflow, e npm risponde con un 403 che dice esattamente questo.
      - name: Publish
        run: |
          set +e
          OUT="$(npm publish 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            echo "::notice::pubblicata su npm"
            exit 0
          fi
          if echo "$OUT" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT"; then
            echo "::notice::versione già su npm: niente da fare"
            exit 0
          fi
          echo "::error::pubblicazione su npm fallita"
          exit 1
