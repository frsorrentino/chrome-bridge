<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#10233c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- titolo -->
  <text x="70" y="105" fill="#ffffff" font-size="52" font-weight="800">69 tools. One browser.</text>
  <text x="70" y="152" fill="#9db7d8" font-size="26">From clicking a button to tracing a page — nine groups, 46 in the default set.</text>


  <!-- griglia gruppi: 3 × 3 -->
  <g>
    <rect x="70" y="190" width="340" height="96" rx="16" fill="#16283f" stroke="#24405e" stroke-width="2"/>
    <text x="130" y="254" fill="#38bdf8" font-size="44" font-weight="800" text-anchor="middle">13</text>
    <text x="178" y="232" fill="#e6edf3" font-size="20" font-weight="700">Navigation</text>
    <text x="178" y="258" fill="#8b98a9" font-size="16">tabs, windows, screenshots</text>
    <rect x="430" y="190" width="340" height="96" rx="16" fill="#16283f" stroke="#24405e" stroke-width="2"/>
    <text x="490" y="254" fill="#38bdf8" font-size="44" font-weight="800" text-anchor="middle">11</text>
    <text x="538" y="232" fill="#e6edf3" font-size="20" font-weight="700">Interaction</text>
    <text x="538" y="258" fill="#8b98a9" font-size="16">click, forms, upload, dialogs</text>
    <rect x="790" y="190" width="340" height="96" rx="16" fill="#16283f" stroke="#24405e" stroke-width="2"/>
    <text x="850" y="254" fill="#38bdf8" font-size="44" font-weight="800" text-anchor="middle">12</text>
    <text x="898" y="232" fill="#e6edf3" font-size="20" font-weight="700">DOM &amp; Inspection</text>
    <text x="898" y="258" fill="#8b98a9" font-size="16">read, extract, query, CSS</text>
    <rect x="70" y="300" width="340" height="96" rx="16" fill="#16283f" stroke="#24405e" stroke-width="2"/>
    <text x="130" y="364" fill="#38bdf8" font-size="44" font-weight="800" text-anchor="middle">8</text>
    <text x="178" y="342" fill="#e6edf3" font-size="20" font-weight="700">Debug &amp; Network</text>
    <text x="178" y="368" fill="#8b98a9" font-size="16">console, network, mocking</text>
    <rect x="430" y="300" width="340" height="96" rx="16" fill="#1d4ed8"/>
    <text x="490" y="364" fill="#ffffff" font-size="44" font-weight="800" text-anchor="middle">2</text>
    <text x="538" y="342" fill="#ffffff" font-size="20" font-weight="700">WebMCP</text>
    <text x="538" y="368" fill="#cfe6ff" font-size="16">tools the page declares</text>
    <rect x="790" y="300" width="340" height="96" rx="16" fill="#16283f" stroke="#24405e" stroke-width="2"/>
    <text x="850" y="364" fill="#38bdf8" font-size="44" font-weight="800" text-anchor="middle">5</text>
    <text x="898" y="342" fill="#e6edf3" font-size="20" font-weight="700">Visual &amp; Responsive</text>
    <text x="898" y="368" fill="#8b98a9" font-size="16">pixel diff, viewport, media</text>
    <rect x="70" y="410" width="340" height="96" rx="16" fill="#16283f" stroke="#24405e" stroke-width="2"/>
    <text x="130" y="474" fill="#38bdf8" font-size="44" font-weight="800" text-anchor="middle">2</text>
    <text x="178" y="452" fill="#e6edf3" font-size="20" font-weight="700">Audits</text>
    <text x="178" y="478" fill="#8b98a9" font-size="16">a11y, SEO, security, links</text>
    <rect x="430" y="410" width="340" height="96" rx="16" fill="#16283f" stroke="#24405e" stroke-width="2"/>
    <text x="490" y="474" fill="#38bdf8" font-size="44" font-weight="800" text-anchor="middle">10</text>
    <text x="538" y="452" fill="#e6edf3" font-size="20" font-weight="700">State &amp; Files</text>
    <text x="538" y="478" fill="#8b98a9" font-size="16">storage, recording, files</text>
    <rect x="790" y="410" width="340" height="96" rx="16" fill="#16283f" stroke="#24405e" stroke-width="2"/>
    <text x="850" y="474" fill="#38bdf8" font-size="44" font-weight="800" text-anchor="middle">6</text>
    <text x="898" y="452" fill="#e6edf3" font-size="20" font-weight="700">Motion &amp; Performance</text>
    <text x="898" y="478" fill="#8b98a9" font-size="16">animations, traces, video</text>
  </g>

  <!-- tagline -->
  <text x="70" y="565" fill="#ffffff" font-size="25" font-weight="700">Headless mode included — <tspan fill="#9db7d8" font-weight="400">the same tools drive a browser in CI, no screen attached.</tspan></text>
</svg>
