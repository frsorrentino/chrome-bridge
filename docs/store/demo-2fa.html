<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in — MyApp staging</title><style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f4f6fa; font-family: system-ui, sans-serif; color: #1c2533;
    display: flex; align-items: center; justify-content: center; }
  .card { width: 400px; background: #fff; border-radius: 12px; padding: 36px 36px 30px;
    box-shadow: 0 8px 30px rgba(20,35,60,0.12); }
  .brand { font-weight: 800; font-size: 20px; color: #3b5bdb; margin-bottom: 22px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 22px; color: #5b6778; font-size: 15px; line-height: 1.45; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font-size: 22px; letter-spacing: 8px; text-align: center; padding: 10px;
    border: 1px solid #c9d2e0; border-radius: 8px; margin-bottom: 18px; }
  button { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; color: #fff;
    background: #3b5bdb; border: 0; border-radius: 8px; }
</style></head><body>
  <form class="card" onsubmit="return false">
    <div class="brand">MyApp · staging</div>
    <h1>Two-step verification</h1>
    <p>We sent a 6-digit code to the phone ending in 42. Enter it to continue to the admin panel.</p>
    <label for="code">Verification code</label>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
    <button type="submit">Verify</button>
  </form>
</body></html>
