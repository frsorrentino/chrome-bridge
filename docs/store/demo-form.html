<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>New client — MyApp admin</title><style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f4f6fa; font-family: system-ui, sans-serif; color: #1c2533;
    display: flex; align-items: center; justify-content: center; }
  form { width: 640px; background: #fff; border-radius: 12px; padding: 30px 34px 28px;
    box-shadow: 0 8px 30px rgba(20,35,60,0.12); }
  .brand { font-weight: 800; font-size: 15px; color: #3b5bdb; margin-bottom: 6px; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .f { position: relative; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 15px; padding: 9px 11px;
    border: 1px solid #c9d2e0; border-radius: 8px; background: #fff; color: #1c2533; }
  textarea { height: 64px; resize: none; }
  button { margin-top: 6px; padding: 11px 22px; font-size: 15px; font-weight: 600; color: #fff;
    background: #3b5bdb; border: 0; border-radius: 8px; }
  .ref { position: absolute; top: -2px; right: 0; font: 600 11px ui-monospace, monospace;
    color: #0b5d3b; background: #d3f4e3; border: 1px solid #7fd8a8; border-radius: 5px; padding: 1px 6px; }
</style></head><body>
  <form onsubmit="return false">
    <div class="brand">MyApp · admin</div>
    <h1>New client</h1>
    <div class="row">
      <div class="f"><label for="first">First name</label><input id="first" name="first"></div>
      <div class="f"><label for="last">Last name</label><input id="last" name="last"></div>
    </div>
    <div class="row">
      <div class="f"><label for="email">Email</label><input id="email" name="email" type="email"></div>
      <div class="f"><label for="company">Company</label><input id="company" name="company"></div>
    </div>
    <div class="row">
      <div class="f"><label for="plan">Plan</label><select id="plan" name="plan"><option value="">Choose…</option><option>Starter</option><option>Team</option><option>Enterprise</option></select></div>
      <div class="f"><label for="country">Country</label><select id="country" name="country"><option value="">Choose…</option><option>Italy</option><option>Germany</option><option>France</option><option>Spain</option></select></div>
    </div>
    <button type="submit">Create client</button>
  </form>
</body></html>
